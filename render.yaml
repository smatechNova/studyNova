services:
  - type: web
    name: studynova-web
    runtime: static
    buildCommand: npm ci && npm run mobile:export:web
    staticPublishPath: ./apps/mobile/dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_ENABLE_DEMO_ENTRY
        value: "false"
      - key: EXPO_PUBLIC_ENABLE_TESTER_FEEDBACK
        value: "false"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: studynova-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    disk:
      name: studynova-data
      mountPath: /var/data/studynova
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_DATA_PATH
        value: /var/data/studynova/studynova.sqlite3
      - key: BACKUP_DATA_PATH
        value: /var/data/studynova/backups
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        value: ""
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        value: support@studynova.app
      - key: EMAIL_VERIFICATION_TTL_MINUTES
        value: "20"
      - key: EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: EMAIL_VERIFICATION_MAX_REQUESTS_PER_HOUR
        value: "5"
      - key: EMAIL_VERIFICATION_MAX_ATTEMPTS
        value: "5"
